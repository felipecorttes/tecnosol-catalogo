<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecno Sol · Administrador</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin admin--login">
  <form class="login" id="form-login">
    <img src="/img/logo.png" alt="Tecno Sol" class="login__logo">
    <h1 class="login__title">Panel de administración</h1>
    <input type="email" id="email" class="modal__input" placeholder="Correo" required>
    <input type="password" id="clave" class="modal__input" placeholder="Contraseña" required>
    <p class="login__error" id="error"></p>
    <button type="submit" class="modal__send">Entrar</button>
  </form>
  <script src="/admin/login.js"></script>
</body>
</html>
