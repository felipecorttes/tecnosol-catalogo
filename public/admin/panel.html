<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecno Sol · Mis productos</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
  <header class="admin__header">
    <img src="/img/logo.png" alt="Tecno Sol" class="admin__logo">
    <button id="btn-salir" class="admin__salir">Salir</button>
  </header>

  <main class="admin__main">
    <div class="admin__barra">
      <h1>Mis productos</h1>
      <button id="btn-nuevo" class="admin__nuevo">+ Nuevo producto</button>
    </div>
    <div id="lista"></div>
  </main>

  <div class="modal" id="modal-form">
    <form class="modal__box" id="form-producto">
      <h2 class="modal__title" id="form-titulo">Nuevo producto</h2>
      <input type="text" id="f-nombre" class="modal__input" placeholder="Nombre *" required>
      <input type="text" id="f-sku" class="modal__input" placeholder="Código (SKU)">
      <input type="text" id="f-categoria" class="modal__input" placeholder="Categoría">
      <input type="number" id="f-precio" class="modal__input" placeholder="Precio *" min="0" required>
      <input type="number" id="f-stock" class="modal__input" placeholder="Cantidad en stock" min="0" value="0">
      <label class="admin__label">Foto</label>
      <input type="file" id="f-imagen" accept="image/*">
      <img id="f-preview" class="admin__preview" alt="" hidden>
      <label class="admin__check"><input type="checkbox" id="f-activo" checked> Visible en el catálogo</label>
      <p class="login__error" id="f-error"></p>
      <button type="submit" class="modal__send">Guardar</button>
      <button type="button" class="modal__close" id="f-cancelar">Cancelar</button>
    </form>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
